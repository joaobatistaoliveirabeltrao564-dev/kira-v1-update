<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kira AI V2</title>
<style>
body {
  margin: 0;
  background: #101019;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #1b1730;
  text-align: center;
  border-bottom: 1px solid #49366b;
}
header h1 { color: #c4a4ff; }
#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}
.msg {
  padding: 12px;
  margin: 10px 0;
  border-radius: 14px;
  white-space: pre-wrap;
}
.kira { background: #272139; }
.user { background: #673ab7; margin-left: 15%; }
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #171421;
  box-sizing: border-box;
}
input {
  width: 68%;
  padding: 13px;
  border-radius: 20px;
  border: 0;
  background: #292536;
  color: white;
}
button {
  padding: 12px;
  border: 0;
  border-radius: 20px;
  background: #8b5cf6;
  color: white;
}
</style>
</head>
<body>
<header>
  <h1>✦ Kira AI</h1>
  <p>Sua amiga virtual 💜</p>
</header>

<div id="chat">
  <div class="msg kira">
    Oii! 💜 Eu sou a Kira!
    Vamos conversar?
  </div>
</div>

<footer>
  <input id="mensagem" placeholder="Converse com a Kira...">
  <button onclick="enviar()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");

function adicionar(tipo, texto) {
  const div = document.createElement("div");
  div.className = "msg " + tipo;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function enviar() {
  const campo = document.getElementById("mensagem");
  const texto = campo.value.trim();

  if (!texto) return;

  adicionar("user", texto);
  campo.value = "";

  adicionar("kira",
    "Recebi sua mensagem! 💜 " +
    "Para eu responder com inteligência de verdade, " +
    "preciso conectar um modelo de IA."
  );
}

document.getElementById("mensagem")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") enviar();
  });
</script>
</body>
</html>
